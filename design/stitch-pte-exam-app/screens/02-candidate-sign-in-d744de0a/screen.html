<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1366, initial-scale=1.0">
  <title>PTE Academic - Candidate Sign-in</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #F4F5F7;
      color: #1F2933;
      width: 1366px;
      height: 768px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Minimal Top Bar for Pre-test / Sign-in */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #D8DCE3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 20px;
      font-weight: bold;
      color: #1F2933;
      letter-spacing: -0.5px;
    }

    .brand-divider {
      width: 1px;
      height: 20px;
      background-color: #D8DCE3;
    }

    .exam-title {
      font-size: 15px;
      font-weight: bold;
      color: #1F2933;
    }

    .top-meta {
      font-size: 13px;
      color: #5A6473;
    }

    /* Main Container */
    .main-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Login Card */
    .login-card {
      width: 420px;
      background-color: #FFFFFF;
      border: 1px solid #C9CFD9;
      border-radius: 3px;
      padding: 36px 32px 28px 32px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      text-align: left;
    }

    .login-header {
      margin-bottom: 24px;
      text-align: center;
    }

    .login-pearson-wordmark {
      font-size: 24px;
      font-weight: bold;
      color: #1F2933;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #5A6473;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #1F2933;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 38px;
      border: 1px solid #C9CFD9;
      border-radius: 3px;
      background-color: #FFFFFF;
      padding: 0 12px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: #1F2933;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: #0B5FAE;
      box-shadow: 0 0 0 1px #0B5FAE;
    }

    .login-btn {
      width: 100%;
      height: 38px;
      background-color: #0B5FAE;
      color: #FFFFFF;
      border: none;
      border-radius: 3px;
      font-size: 14px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 18px;
    }

    .login-btn:hover {
      background-color: #094C8C;
    }

    .login-btn:focus {
      outline: 2px solid #0B5FAE;
      outline-offset: 2px;
    }

    .helper-box {
      border-top: 1px solid #E4E7EB;
      padding-top: 14px;
    }

    .helper-text {
      font-size: 12px;
      line-height: 1.5;
      color: #5A6473;
    }

    /* Minimal Bottom Bar */
    .bottom-bar {
      height: 48px;
      background-color: #FFFFFF;
      border-top: 1px solid #D8DCE3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 12px;
      color: #5A6473;
    }

    .bottom-bar a {
      color: #0B5FAE;
      text-decoration: none;
    }

    .bottom-bar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-section">
      <span class="brand-logo">Pearson</span>
      <span class="brand-divider"></span>
      <span class="exam-title">PTE Academic</span>
    </div>
    <div class="top-meta">
      Test Delivery System v4.8.2
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="main-area">
    <div class="login-card">
      <div class="login-header">
        <div class="login-pearson-wordmark">Pearson</div>
        <div class="login-subtitle">Candidate Sign-In</div>
      </div>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="username">Login username</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            autocomplete="off" 
            autofocus 
            value="nguyen.vana@testcentre.vn"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Login password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            autocomplete="off" 
            value="••••••••••••"
          />
        </div>

        <button type="submit" class="login-btn">Log in</button>

        <div class="helper-box">
          <p class="helper-text">
            Your username and password are on the sheet provided by the Test Administrator. If you need assistance, please raise your hand.
          </p>
        </div>
      </form>
    </div>
  </main>

  <!-- Bottom Bar -->
  <footer class="bottom-bar">
    <div>Secure Test Environment &bull; Workstation #08</div>
    <div>Pearson VUE &copy; All rights reserved.</div>
  </footer>

</body>
</html>
